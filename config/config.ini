# Falcon Integration Gateway

[gateway]
# Uncomment to enable backends. Alternatively, use FIG_BACKENDS env variable.
# The gateway will push events to the cloud providers specified below
#backends = AWS,AWS_SQS,AZURE,GCP,WORKSPACEONE,CLOUDTRAIL_LAKE,GENERIC

# Uncomment to configure number of threads that process Falcon Events. Alternatively,
# use FIG_WORKER_THREADS env variable.
#worker_threads = 4

# Bounded capacity of the in-memory event channel between the stream reader and
# the worker pool. A full channel backpressures the reader (the intended flow
# control). 0 (default) derives the capacity from worker_threads.
# Alternatively, use FIG_QUEUE_DEPTH env variable.
#queue_depth = 0

# Listen address for the built-in HTTP server exposing Prometheus /metrics and
# the /healthz and /readyz probes. Empty (default) disables the server. This
# endpoint has no authentication and exposes operational metrics, so bind it to
# localhost or a trusted operator-only network (e.g. 127.0.0.1:8080), never a
# public interface.
# Alternatively, use FIG_METRICS_ADDR env variable.
#metrics_addr = 127.0.0.1:8080

[events]
# Uncomment to filter out events based on severity (allowed values 1-5, default 2).
# Events are kept when their mapped severity is at or above this threshold. An
# event with a missing or unrecognized SeverityName maps to 5 (Critical), so it
# is never filtered out by this threshold — the filter fails open.
# Alternatively, use EVENTS_SEVERITY_THRESHOLD env variable.
#severity_threshold = 3

# Uncomment to filter out events based on number of days past the event (default 21).
# Alternatively, use EVENTS_OLDER_THAN_DAYS_THRESHOLD env variable.
#older_than_days_threshold = 14

# Exclude events originating from certain cloud environments (AWS, Azure, GCP, or unrecognized)
# detections_exclude_clouds =

# Pass in the offset to start the stream from. This is useful to prevent duplicate events.
# Alternatively, use EVENTS_OFFSET env variable. (default: 0)
#offset = 0

# Start streaming from the newest event instead of using an offset. When enabled,
# the gateway will begin processing only new events that occur after startup.
# This is mutually exclusive with a non-zero offset value.
# Alternatively, use EVENTS_START_FROM_NEWEST env variable. (default: false)
#start_from_newest = false

# Where the per-feed resume watermark (offset) is persisted. (default: file)
#   file   - atomic JSON file at offset_store_path.
#   ssm    - AWS SSM parameter named by offset_store_path (region from
#            offset_store_region or the ambient AWS config).
#   memory - ephemeral, not persisted across restarts (intended for tests).
#offset_store = file

# Path to the file offset store, or the SSM parameter name when offset_store = ssm.
# (default: offsets.json)
#offset_store_path = offsets.json

# AWS region for the ssm offset store. Empty falls back to the ambient AWS
# configuration.
#offset_store_region =

# How to handle an event whose backend delivery keeps failing after retries are
# exhausted. (default: drop)
#   drop    - discard the event, advance the resume watermark, and continue. The
#             payload is not delivered anywhere and is not written to any
#             dead-letter sink; the drop is logged and counted in the
#             fig_events_dropped_after_retry_total metric. "discard" is an alias.
#   block   - stop advancing the resume watermark on the failing event. Pending
#             offsets accumulate in memory (bounded by pending_max, below) and
#             delivery only resumes once the failing backend recovers and the
#             process is restarted. Use only when losing an event is worse than
#             halting the gateway.
# ("dlq" is accepted as a deprecated alias for "drop" — there is no dead-letter sink.)
#delivery_failure = drop

# Log a throttled warning when the in-memory pending-offset set for a feed grows
# past this size without the resume watermark advancing — an early signal of an
# offset gap or a stuck backend. Set 0 to disable. (default: 1000)
#pending_warn_threshold = 1000

# Soft alarm on the in-memory in-flight offset set per feed. When the set grows
# past this size (only reachable under delivery_failure = block, when a failing
# backend stops the resume watermark from advancing), the gateway logs an error
# and increments fig_pending_overflow_total. Offsets are still tracked — they are
# never dropped, because a received-but-undelivered offset cannot be discarded
# without risking event loss. The cap is a visibility signal that the backlog is
# not draining and the process must be restarted once the backend recovers; it
# does not bound memory on its own. Set 0 to disable the check. (default: 0)
#pending_max = 0

[logging]
# Uncomment to request logging level (ERROR, WARN, INFO, DEBUG). Alternatively, use
# LOG_LEVEL env variable.
#level = DEBUG

[falcon]
# Uncomment to provide Falcon Cloud. Alternatively, use FALCON_CLOUD env variable.
# Defaults to autodiscover. Set explicitly if needed.
#cloud = us-1

# Uncomment to provide OAuth Client ID.
# Alternatively, use FALCON_CLIENT_ID env variable or a credentials store (see [credentials_store] section).
#client_id = ABCD

# Uncomment to provide OAuth Secret.
# Alternatively, use FALCON_CLIENT_SECRET env variable or a credentials store (see [credentials_store] section).
#client_secret = ABCD

# Uncomment to provide application id. Needs to be different per each fig instance.
# Alternatively, use FALCON_APPLICATION_ID env variable.
#application_id = my-acme-gcp-1

# Number of times the stream supervisor retries a failed reconnect before giving
# up on a session rebuild (1-9999, default 36). Alternatively, use
# FALCON_RECONNECT_RETRY_COUNT env variable.
#reconnect_retry_count = 36

# Keyword used to detect an RTR-based quarantine action during enrichment.
# (default: infected)
#rtr_quarantine_keyword = infected

[credentials_store]
# Uncomment to provide credentials store. Alternatively, use CREDENTIALS_STORE env variable.
# Supported values: ssm, secrets_manager
#store = ssm

[ssm]
# Uncomment to provide aws region for SSM. Alternatively, use SSM_REGION env variable.
#region = us-west-2

# Uncomment to provide SSM parameter name or path for client id. Alternatively, use SSM_CLIENT_ID env variable.
#ssm_client_id = /falcon/fig/client_id

# Uncomment to provide SSM parameter name or path for client secret. Alternatively, use SSM_CLIENT_SECRET env variable.
#ssm_client_secret = /falcon/fig/client_secret

[secrets_manager]
# Uncomment to provide aws region for Secrets Manager. Alternatively, use SECRETS_MANAGER_REGION env variable.
#region = us-west-2

# Uncomment to provide Secrets Manager secret name. Alternatively, use SECRETS_MANAGER_SECRET_NAME env variable.
#secrets_manager_secret_name = falcon/fig/credentials

# Uncomment to provide Secrets Manager client id key. Alternatively, use SECRETS_MANAGER_CLIENT_ID_KEY env variable.
#secrets_manager_client_id_key = client_id

# Uncomment to provide Secrets Manager client secret key. Alternatively, use SECRETS_MANAGER_CLIENT_SECRET_KEY env variable.
#secrets_manager_client_secret_key = client_secret

[generic]
# Generic section is applicable only when GENERIC backend is enabled in the [gateway] section.
# Generic backend can be used for outputting events to STDOUT

# Uncomment to configure which event types to process. Alternatively, use GENERIC_EVENT_TYPES env variable.
# Use "ALL" to process all event types, or provide comma-separated list of specific types.
# Common event types:
#   - EppDetectionSummaryEvent (detection/threat events)
#   - AuthActivityAuditEvent (authentication/audit events)
# Examples:
#   event_types = ALL
#   event_types = EppDetectionSummaryEvent
#   event_types = EppDetectionSummaryEvent,AuthActivityAuditEvent
#event_types = ALL

[gcp]
# GCP section is applicable only when GCP backend is enabled in the [gateway] section.

# Use GOOGLE_APPLICATION_CREDENTIALS env variable to configure GCP Backend. GOOGLE_APPLICATION_CREDENTIALS
# is an environment variable used to configure GCP Service accounts, it should point out to the credentials
# file for given service account.

[azure]
# Azure section is applicable only when AZURE backend is enabled in the [gateway] section.
#
# Each forwarded record carries a "FalconEventId" field: a deterministic,
# retry-stable identifier for the event. Azure Log Analytics does not
# de-duplicate on ingest, so if the gateway restarts mid-batch a duplicate row
# may land. Downstream consumers can collapse duplicates by grouping on
# FalconEventId.

# Uncomment to provide Azure Workspace ID. Alternatively, use WORKSPACE_ID env variable.
#workspace_id =
# Uncomment to provide Azure Primary Key. Alternatively, use PRIMARY_KEY env variable.
#primary_key =

# Uncomment to enable RTR based auto discovery of Azure Arc Systems. Alternatively,
# use ARC_AUTODISCOVERY env variable.
#arc_autodiscovery = true

# Azure authentication method. (default: legacy)
#   legacy          - HTTP Data Collector API signed with workspace_id + primary_key (above).
#   client_secret   - Logs Ingestion API via an Entra ID app registration; requires
#                     tenant_id, client_id, client_secret, dcr_endpoint, dcr_immutable_id.
#   workload_identity - Logs Ingestion API via a federated workload identity; requires
#                     dcr_endpoint and dcr_immutable_id.
# Alternatively, use AZURE_AUTH_METHOD env variable.
#auth_method = legacy

# Entra ID tenant ID (required when auth_method = client_secret).
# Alternatively, use AZURE_TENANT_ID env variable.
#tenant_id =

# Entra ID application (client) ID (required when auth_method = client_secret).
# Alternatively, use AZURE_CLIENT_ID env variable.
#client_id =

# Entra ID application client secret (required when auth_method = client_secret).
# Alternatively, use AZURE_CLIENT_SECRET env variable.
#client_secret =

# Data Collection Rule ingestion endpoint (required for client_secret and
# workload_identity auth). Alternatively, use AZURE_DCR_ENDPOINT env variable.
#dcr_endpoint =

# Data Collection Rule immutable ID (required for client_secret and
# workload_identity auth). Alternatively, use AZURE_DCR_IMMUTABLE_ID env variable.
#dcr_immutable_id =

[aws]
# AWS section is applicable only when AWS backend is enabled in the [gateway] section.

# Uncomment to provide aws region. Alternatively, use AWS_REGION env variable
#region = eu-west-1

# Uncomment to manage whether or not to confirm instance in AWS account supported region.
# Alternatively, use AWS_CONFIRM_INSTANCE env variable.
#confirm_instance = true

# Uncomment to accept and process events from any source (default: false). Alternatively, use the
# AWS_ACCEPT_ALL_EVENTS env variable.
# When false: Only process events from AWS cloud provider
# When true: Process all events (Non-AWS + AWS events)
#accept_all_events=true

[cloudtrail_lake]
# AWS CloudTrail Lake section is applicable only when CLOUDTRAIL_LAKE backend is enabled in the [gateway] section.

# Uncomment to provide the Channel ARN. Alternatively, use CLOUDTRAIL_LAKE_CHANNEL_ARN env variable.
#channel_arn =

# Uncomment to provide the AWS region. Should match the same region as the Channel.
# Alternatively, use CLOUDTRAIL_LAKE_REGION env variable.
#region =

[aws_sqs]
# AWS SQS section is applicable only when AWS backend is enabled in the [gateway] section.
# AWS SQS Backend publishes raw events to SQS queue

# Uncomment to provide AWS region. Alternatively, use AWS_REGION env variable
#region = eu-west-1

# Uncomment to provide name of AWS SQS. Alternatively, use AWS_SQS env variable
#sqs_queue_name = my-sqs-queue-for-falcon

[workspaceone]
# Workspace One section is applicable only when Workspace One backend is enabled in the [gateway] section.
#
# Each CEF record carries a "cs4" custom string (labeled FalconEventId): a
# deterministic, retry-stable identifier for the event. Syslog does not
# de-duplicate on ingest, so if the gateway restarts mid-batch a duplicate
# record may arrive. Downstream consumers can collapse duplicates by grouping
# on the cs4 / FalconEventId value.

# Uncomment to provide Workspace One token. Alternatively, use WORKSPACEONE_TOKEN env variable
#token =

# Uncomment to provide syslog host. Alternatively, use SYSLOG_HOST env variable
#syslog_host =

# Uncomment to provide syslog port. Alternatively, use SYSLOG_PORT env variable
#syslog_port =

# Uncomment to verify the syslog server's TLS certificate. Default false for parity with the
# reference deployment; set true when the receiver presents a valid certificate.
# Alternatively, use WORKSPACEONE_TLS_VERIFY env variable
#tls_verify = false

[cache]
# The enrichment cache memoizes per-sensor host details, MDM identifiers, and
# Azure Arc config so concurrent workers hit the Hosts/RTR APIs at most once per
# sensor.

# Maximum number of entries in the enrichment cache (1-1000000, default 8192).
# Alternatively, use CACHE_SIZE env variable.
#size = 8192

# Time-to-live for enrichment cache entries as a Go duration (e.g. 1h, 30m).
# Must be non-negative. (default: 1h). Alternatively, use CACHE_TTL env variable.
#ttl = 1h
